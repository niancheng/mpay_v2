name: Development source export
on:
  push:
    branches: [feat/alipay-store-bill]
    paths: [.github/workflows/dev-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o /tmp/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: development-source
          path: /tmp/source.tar.gz
          retention-days: 2
