name: Amount routing patch workbench
on:
  push:
    branches: [feat/amount-aware-store-routing]
    paths: [.github/amount-routing.ready]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/amount-aware-store-routing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/amount-aware-store-routing'
          cat .github/amount-routing-part-{1,2,3,4}.b64 | base64 --decode | gzip --decompress > /tmp/amount-routing.patch
          echo 'ae5fbe78ca222f1ad84c6d8126cd1654a60357a957aa785bcb814c829c2c61e1  /tmp/amount-routing.patch' | sha256sum --check
          git apply --check /tmp/amount-routing.patch
          git apply /tmp/amount-routing.patch
          find app tests -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log
          git diff --check
          git add app tests docs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(payment): add atomic amount-aware store routing with full-route tests'
          git push origin HEAD:refs/heads/feat/amount-aware-store-routing
