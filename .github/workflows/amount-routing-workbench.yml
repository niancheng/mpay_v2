name: Amount routing source workbench
on:
  push:
    branches: [feat/amount-aware-store-routing]
    paths: [.github/workflows/amount-routing-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output=/tmp/mpay-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mpay-amount-routing-source
          path: /tmp/mpay-source.tar.gz
          retention-days: 1
          compression-level: 0
