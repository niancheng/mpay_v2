name: Inspect failed image publication
on:
  push:
    branches: [ci/release-diagnostics]
permissions:
  contents: read
  checks: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
              owner: context.repo.owner, repo: context.repo.repo, job_id: 126125616483
            });
            const text = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
            const lines = text.split(/\r?\n/);
            const failure = lines.findIndex(line => line.includes('##[error]Process completed'));
            console.log(lines.slice(Math.max(0, failure - 65), failure + 2).map(line => line.slice(0, 2000)).join('\n'));
