name: Inspect failed image publication
on:
  push:
    branches: [ci/release-diagnostics]
permissions:
  contents: read
  checks: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const annotations = await github.paginate(github.rest.checks.listAnnotations, {
              owner, repo, check_run_id: 126125616483, per_page: 100
            });
            for (const annotation of annotations) {
              console.log(JSON.stringify({level: annotation.annotation_level, title: annotation.title, message: annotation.message}).slice(0, 8000));
            }
            const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
              owner, repo, job_id: 126125616483
            });
            const text = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
            const lines = text.split(/\r?\n/);
            const matches = lines.map((line, index) => ({line, index})).filter(({line}) => /ERROR|error:|failed to|exceeded|denied|not found/i.test(line));
            for (const match of matches.slice(-20)) console.log(lines.slice(Math.max(0, match.index - 1), match.index + 2).join('\n').slice(0, 6000));
