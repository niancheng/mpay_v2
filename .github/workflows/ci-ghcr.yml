name: Test and publish MPAY GHCR image
on:
  push:
    branches: [master, feat/alipay-store-bill]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: PHP ${{ matrix.php }} and MySQL receipt tests
    # Match the pinned browser toolchain instead of following ubuntu-latest upgrades.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: mpay_test_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: mpay_test_ci
      DB_USERNAME: root
      DB_PASSWORD: test-only
      MPAY_TEST_DATABASE: mpay_test_ci
      CACHE_DRIVER: redis
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, redis, gd, bcmath, sockets, pcntl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts --no-progress
      - name: PHP syntax checks
        run: find app database/migrations docker tests -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log
      - name: Persistent data layout regression
        run: php tests/docker_data_layout.php
      - run: php tests/store_rules.php
      - run: php tests/store_integration.php
      - run: php tests/store_concurrency.php
      - run: php tests/store_routing.php
      - run: php tests/store_routing_concurrency.php
      - name: Payment reuse state and signed V2 protocol regression
        run: php tests/payment_reuse.php
      - name: Signed V1 submit and API reuse regression
        run: php tests/payment_reuse_v1.php
      - name: Payment reuse cross-process concurrency regression
        run: php tests/payment_reuse_concurrency.php
      - uses: actions/setup-node@v4
        if: matrix.php == '8.3'
        with:
          node-version: '22'
      - name: Read-only waiting page regression
        if: matrix.php == '8.3'
        run: node --test tests/payment_waiting.test.cjs
      - name: Actual cashier browser regression (desktop and mobile)
        if: matrix.php == '8.3'
        run: |
          npm install --prefix "$RUNNER_TEMP/mpay-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/mpay-browser/node_modules/.bin/playwright" install --with-deps chromium
          MPAY_PLAYWRIGHT_PATH="$RUNNER_TEMP/mpay-browser/node_modules/playwright" node tests/payment_waiting_browser.cjs
      - name: Build and smoke-test container
        if: matrix.php == '8.3'
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t mpay:ci .
          docker run --rm mpay:ci php -r 'require "vendor/autoload.php"; echo PHP_VERSION, "\n";'
          docker run -d --name mpay-smoke -p 127.0.0.1:18787:8787 mpay:ci
          trap 'docker logs mpay-smoke; docker rm -f mpay-smoke' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent -o /tmp/mpay-smoke.html http://127.0.0.1:18787/install; then break; fi
            sleep 2
          done
          test -s /tmp/mpay-smoke.html
          grep -qi '<html' /tmp/mpay-smoke.html
      - name: Original v2.1.2 data volume and JWT upgrade smoke test
        if: matrix.php == '8.3'
        run: bash tests/docker_data_smoke.sh mpay:ci
      - name: Validate Compose
        run: cp .env.example .env && MPAY_NETWORK=mpay-ci docker compose config --quiet
  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="$(cat VERSION)"
          [[ "$version" =~ ^[a-z0-9.-]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published image and both architecture data layouts
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          # Pin each platform's own manifest: classic Docker stores cannot map the
          # same multi-platform index digest to two different image configurations.
          manifest="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")"
          for arch in amd64 arm64; do
            platform_digest="$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length == 1 then .[0].digest else error("Expected exactly one manifest for " + $arch) end
            ' <<< "$manifest")"
            [[ "$platform_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            platform_image="$IMAGE@$platform_digest"
            echo "Verifying linux/$arch: $platform_image"
            docker pull --platform "linux/$arch" "$platform_image"
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$platform_image")"
            version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$platform_image")"
            [[ "$revision" == "$GITHUB_SHA" && "$version" == "$VERSION" ]]
            MPAY_TEST_PLATFORM="linux/$arch" bash tests/docker_data_smoke.sh "$platform_image"
          done
          printf 'Image: %s:%s\nDigest: %s\nBoth architecture revision/data/JWT upgrade checks: passed\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
