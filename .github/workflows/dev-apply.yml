name: Verify and commit store receipt implementation
on:
  push:
    branches: [feat/alipay-store-bill]
    paths: [.dev/implementation.patch.gz.b64, .dev/repair.py]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: mpay_test_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: mpay_test_ci
      DB_USERNAME: root
      DB_PASSWORD: test-only
      MPAY_TEST_DATABASE: mpay_test_ci
      CACHE_DRIVER: redis
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Export transport for reproducibility
        run: tar -czf /tmp/transport.tar.gz .dev
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-transport
          path: /tmp/transport.tar.gz
          retention-days: 2
      - name: Apply reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          if test -f .dev/repair.py; then python .dev/repair.py; fi
          cat .dev/parts/*.b64 .dev/implementation.patch.gz.b64 | base64 -d | gzip -dc > /tmp/implementation.patch
          echo 'e70ea8c7916d227299e57cf27b5c51a6746f4397fc5dc2c6b2999b74119d0704  /tmp/implementation.patch' | sha256sum -c
          git apply --check /tmp/implementation.patch
          git apply --index /tmp/implementation.patch
          git diff --cached --check
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, redis, gd, bcmath, sockets, pcntl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts --no-progress
      - run: find app database/migrations tests -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log
      - run: php tests/store_rules.php
      - run: php tests/store_integration.php
      - run: php tests/store_concurrency.php
      - name: Container build and installer smoke test
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t mpay:ci .
          docker run --rm mpay:ci php -r 'require "vendor/autoload.php"; echo PHP_VERSION, "\n";'
          docker run -d --name mpay-smoke -p 127.0.0.1:18787:8787 mpay:ci
          trap 'docker logs mpay-smoke; docker rm -f mpay-smoke' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent -o /tmp/mpay-smoke.html http://127.0.0.1:18787/install; then break; fi
            sleep 2
          done
          test -s /tmp/mpay-smoke.html
          grep -qi '<html' /tmp/mpay-smoke.html
      - run: cp .env.example .env && MPAY_NETWORK=mpay-ci docker compose config --quiet
      - name: Commit tested source and remove temporary tooling
        run: |
          git rm -rf --ignore-unmatch .dev .github/workflows/dev-apply.yml .github/workflows/dev-source-export.yml .github/workflows/dev-dependencies.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'feat: add amount-only Alipay store bill receipts with transactional matching and GHCR build'
          git push origin HEAD:refs/heads/feat/alipay-store-bill
          echo "Tested commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
